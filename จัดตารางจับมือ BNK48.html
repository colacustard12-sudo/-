<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8"><title>จัดตารางจับมือ BNK48</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf6fb;--card:#fff;--tx:#2b2230;--mut:#7d7186;--ac:#b9449f;--acl:#f6dff1;--bd:#e8d9e6;--sp:#d12f4f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--card:#241c29;--tx:#f3eaf5;--mut:#a698ae;--ac:#e07bc8;--acl:#3d2740;--bd:#3a2e40;--sp:#ff6b88}}
:root[data-theme="dark"]{--bg:#17121a;--card:#241c29;--tx:#f3eaf5;--mut:#a698ae;--ac:#e07bc8;--acl:#3d2740;--bd:#3a2e40;--sp:#ff6b88}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Sarabun",sans-serif}
header{padding:14px 14px 4px}h1{margin:0;font-size:18px}.sub{color:var(--mut);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tab{flex:0 0 auto;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:6px 10px;text-align:center;font:inherit;cursor:pointer}
.tab b{display:block;font-size:13px}.tab small{font-size:10.5px;color:var(--mut)}
.tab.on{background:var(--ac);border-color:var(--ac);color:#fff}.tab.on small{color:#fff}
.tab.sp b{color:var(--sp)}.tab.sp.on b{color:#fff}
.tab i{font-style:normal;background:var(--sp);color:#fff;border-radius:9px;font-size:10px;padding:0 5px;margin-left:3px}
.info{margin:2px 14px 8px;padding:8px 10px;background:var(--acl);border-radius:10px;font-size:12.5px}
.grp{margin:10px 14px 4px;font-size:12px;color:var(--mut);font-weight:600}
.list{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px}
.m{border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;text-align:left;font:inherit;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
.m .n{font-weight:600;font-size:14px}.m .l{font-size:11.5px;color:var(--mut)}
.m.on{border-color:var(--ac);background:var(--acl)}.m.on::after{content:"✓";color:var(--ac);font-weight:700}
.m.sp.on{border-color:var(--sp)}.m.sp.on::after{color:var(--sp)}
.empty{padding:20px 14px;color:var(--mut);text-align:center}
.sum{padding:0 14px}.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:8px}
.row h3{margin:0 0 4px;font-size:14px}.row h3 small{color:var(--mut);font-weight:400}
.row div{font-size:14px;padding:2px 0}.warn{color:var(--sp);font-size:12px}
.btns{display:flex;gap:8px;padding:6px 14px 30px}.btns button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
.btns .p{background:var(--ac);border-color:var(--ac);color:#fff}
.days{display:flex;gap:8px;margin-top:8px}.days button{flex:1;padding:9px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer}.days button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
</style></head><body>
<header><h1>🎫 จัดตารางบัตรจับมือ</h1><div class="sub">BNK48 · MCC Hall · 31 ต.ค. – 1 พ.ย. 2026</div><div class="days" id="days"></div></header>
<div class="tabs" id="tabs"></div><div id="main"></div>
<script>
const R=[["รอบ 1","11:00–12:30","12:15"],["รอบ 2","12:30–14:00","13:45"],["รอบ 3","14:00–15:30","15:15"],["รอบ 4","15:30–17:00","16:45"],["รอบ 5","17:00–18:30","18:15"],["Special","19:00–21:00","19:00"]];
// [ชื่อ, ทีม, {รอบ:เลน}, special]
const D=[
["FAME","BIII",{5:4},1],["HOOP","BIII",{2:1,4:1},1],["JANRY","BIII",{1:5,4:5}],["LUKSORN","BIII",{1:8,4:8},1],["MAIL","BIII",{5:17},1],["MARINE","BIII",{2:6,4:6}],["MICHA","BIII",{4:3},1],["MONET","BIII",{1:18,5:19},1],["PATT","BIII",{1:10}],["PRAEW","BIII",{1:9,3:9},1],["WAWA","BIII",{3:10,5:9}],
["ARLEE","NV",{2:7,4:7},1],["BERRY","NV",{3:5},1],["EMMY","NV",{1:4,3:4}],["JEW","NV",{3:8,5:8},1],["L","NV",{1:3,3:3}],["PALMMY","NV",{2:9,4:9}],["PANCAKE","NV",{2:4,4:4},1],["PROUD","NV",{2:14,5:14}],["SAONOI","NV",{3:15},1],["SINDY","NV",{2:8,5:10},1],["YOGHURT","NV",{1:2,2:2,4:2,5:2},1],
["BLYTHE","Trainee",{1:16,2:11}],["CARTOON","Trainee",{2:16,5:16}],["GALEYA","Trainee",{1:7,5:6}],["GRAPE","Trainee",{4:16},1],["INKCHA","Trainee",{2:17,4:17}],["KHAIMOOK","Trainee",{4:11},1],["KHOWJOW","Trainee",{1:15,3:17}],["MAYJI","Trainee",{}],["MINT","Trainee",{5:15},1],["MIRIN","Trainee",{5:13},1],["NALL","Trainee",{3:12,5:12}],["NAMMONN","Trainee",{3:16,5:11}],["NEEN","Trainee",{1:13,3:13}],["NIYA","Trainee",{4:14},1],["ROSE","Trainee",{4:18},1]];
const D2=[
["FAME","BIII",{1:2,3:2}],["HOOP","BIII",{1:1,3:1}],["JANRY","BIII",{2:5,4:5},1],["LUKSORN","BIII",{2:7,5:6}],["MAIL","BIII",{1:7,4:7}],["MARINE","BIII",{2:6,4:6},1],["MICHA","BIII",{2:3,4:3}],["MONET","BIII",{2:2,4:2}],["PATT","BIII",{3:4,5:5},1],["PRAEW","BIII",{2:11,5:11}],["WAWA","BIII",{5:7},1],
["ARLEE","NV",{1:6,3:6}],["BERRY","NV",{1:5,3:5}],["EMMY","NV",{2:4,4:4},1],["JEW","NV",{1:8,3:8}],["L","NV",{2:1,4:1},1],["PALMMY","NV",{3:7},1],["PANCAKE","NV",{3:3,5:3}],["PROUD","NV",{5:1},1],["SAONOI","NV",{2:9,5:9}],["SINDY","NV",{5:4}],["YOGHURT","NV",{}],
["BLYTHE","Trainee",{4:12},1],["CARTOON","Trainee",{4:13},1],["GALEYA","Trainee",{4:8},1],["GRAPE","Trainee",{2:10,5:10}],["INKCHA","Trainee",{4:14},1],["KHAIMOOK","Trainee",{2:8,5:8}],["KHOWJOW","Trainee",{4:15},1],["MAYJI","Trainee",{1:20,3:20,5:20},1],["MINT","Trainee",{1:10,3:10}],["MIRIN","Trainee",{1:11,3:11}],["NALL","Trainee",{4:9},1],["NAMMONN","Trainee",{4:10},1],["NEEN","Trainee",{4:11},1],["NIYA","Trainee",{1:9,3:9}],["ROSE","Trainee",{1:12,3:12}]];
const DAYS=[D,D2];
const TEAMS=["BIII","NV","Trainee"];
let all={0:{},1:{}},day=0,cur=0,SUM=6,sel;
try{const a=JSON.parse(localStorage.getItem("hs26b")||"null");if(a)all=a}catch(e){}
sel=all[day];
const save=()=>{try{localStorage.setItem("hs26b",JSON.stringify(all))}catch(e){}};
function setDay(d){day=d;sel=all[d];cur=0;render()}
const DD=()=>DAYS[day];
const key=(r,n)=>r+"|"+n, has=(r,n)=>!!sel[key(r,n)];
const cnt=r=>Object.keys(sel).filter(k=>k.split("|")[0]==r).length;
function tabs(){document.getElementById("days").innerHTML=["เสาร์ 31 ต.ค.","อาทิตย์ 1 พ.ย."].map((t,i)=>`<button class="${day==i?'on':''}" onclick="setDay(${i})">${t}</button>`).join("");document.getElementById("tabs").innerHTML=R.map((x,i)=>`<button class="tab${i==5?' sp':''}${cur==i?' on':''}" onclick="go(${i})"><b>${x[0]}${cnt(i)?`<i>${cnt(i)}</i>`:''}</b><small>${x[1].split("–")[0]}</small></button>`).join("")+`<button class="tab${cur==SUM?' on':''}" onclick="go(${SUM})"><b>📋 สรุป</b><small>ทั้งวัน</small></button>`}
function go(i){cur=i;render();window.scrollTo(0,0)}
function tog(r,n){const k=key(r,n);if(sel[k])delete sel[k];else{if(r==5)Object.keys(sel).forEach(x=>{if(x.startsWith("5|"))delete sel[x]});sel[k]=1}save();render()}
function render(){tabs();const m=document.getElementById("main");
if(cur==SUM){m.innerHTML=summary();return}
const x=R[cur];let h=`<div class="info"><b>${x[0]} · ${x[1]}</b><br>ปิดเลน ${x[2]} น.${cur==5?" · เลือกได้วันละ 1 เมมเบอร์ (ใช้บัตร 1–100 ใบ)":" · ใช้บัตรได้ 1–5 ใบ/คน เลือกได้หลายคน"}</div>`;
let any=false;
TEAMS.forEach(t=>{const L=DD().filter(d=>d[1]==t&&(cur==5?d[3]:d[2][cur+1]!=null));if(!L.length)return;any=true;
h+=`<div class="grp">${t=="BIII"?"BNK48 Team BIII":t=="NV"?"BNK48 Team NV":"BNK48 Trainee"}</div><div class="list">`+L.map(d=>`<button class="m${cur==5?' sp':''}${has(cur,d[0])?' on':''}" onclick="tog(${cur},'${d[0]}')"><span><span class="n">${d[0]}</span><br><span class="l">${cur==5?"Special":"Lane "+d[2][cur+1]}</span></span></button>`).join("")+`</div>`});
m.innerHTML=h+(any?"":'<div class="empty">ไม่มีสมาชิกในรอบนี้</div>')}
function info(n){return DD().find(d=>d[0]==n)}
function summary(){let h='<div class="sum">',tot=0,txt="📅 ตารางจับมือ "+(day?"1 พ.ย. 26":"31 ต.ค. 26")+"\n";
R.forEach((x,i)=>{const names=Object.keys(sel).filter(k=>k.startsWith(i+"|")).map(k=>k.split("|")[1]);if(!names.length)return;tot+=names.length;
const items=names.map(n=>{const d=info(n);return i==5?n:`${n} (Lane ${d[2][i+1]})`});
h+=`<div class="row"><h3>${x[0]} <small>${x[1]} · ปิดเลน ${x[2]}</small></h3>${items.map(t=>`<div>• ${t}</div>`).join("")}</div>`;
txt+=`\n${x[0]} ${x[1]} (ปิดเลน ${x[2]})\n`+items.map(t=>"- "+t).join("\n")+"\n"});
if(!tot)h+='<div class="empty">ยังไม่ได้เลือกใคร<br>กดแท็บรอบเวลาแล้วเลือกสมาชิกได้เลย</div>';
return h+`</div><div class="btns"><button class="p" onclick='cp(${JSON.stringify(txt)})'>คัดลอกสรุป</button><button onclick="clr()">ล้างทั้งหมด</button></div>`}
function cp(t){try{navigator.clipboard.writeText(t).then(()=>alert("คัดลอกแล้ว"),()=>alert(t))}catch(e){alert(t)}}
function clr(){if(confirm("ล้างที่เลือกทั้งหมด?")){all[day]={};sel=all[day];save();render()}}
render();
</script></body></html>
